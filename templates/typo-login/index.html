<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>错别字登陆表单 · UIgly</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; background: #f4f3ef; color: #222; font: 16px Arial, sans-serif; }
    main { width: min(100%, 360px); margin: 0 auto; padding: 24px; border: 2px solid #333; background: #fff; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { margin: 0 0 24px; }
    label { display: block; margin: 16px 0 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #777; border-radius: 0; font: inherit; }
    button { width: 100%; margin-top: 22px; padding: 11px; border: 2px solid #333; background: #f2e35b; color: #222; font: inherit; cursor: pointer; }
    small { display: block; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>欢迎登陆</h1>
    <p>请填写您的帐号信息。</p>
    <label for="username">userName</label>
    <input id="username" name="username" type="text" placeholder="请输入帐号" autocomplete="off">
    <label for="password">密马</label>
    <input id="password" name="password" type="text" placeholder="请输入密马" autocomplete="off">
    <button type="button">立即登陆</button>
    <small>忘记密马？请重新注测一个帐号。</small>
  </main>
</body>
</html>
