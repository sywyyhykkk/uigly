<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>换行的表单标签 · UIgly</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; background: #f5f5f5; color: #222; font: 16px Arial, sans-serif; }
    main { width: min(100%, 480px); margin: 0 auto; padding: 24px; border: 1px solid #ccc; background: #fff; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 24px; color: #666; font-size: 14px; }
    .row { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 12px; margin-bottom: 12px; }
    label { line-height: 1.5; }
    input { width: 100%; height: 38px; padding: 8px; border: 1px solid #aaa; border-radius: 2px; font: inherit; }
    button { margin-left: 124px; padding: 9px 20px; border: 1px solid #888; background: #eee; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>填写资料</h1>
    <p>请确认以下信息。</p>
    <div class="row">
      <label for="name">姓名</label>
      <input id="name" name="name" type="text">
    </div>
    <div class="row">
      <label for="document-number">身份证件号码</label>
      <input id="document-number" name="document-number" type="text">
    </div>
    <div class="row">
      <label for="city">所在城市</label>
      <input id="city" name="city" type="text">
    </div>
    <div class="row">
      <label for="emergency-phone">紧急联系人电话号码</label>
      <input id="emergency-phone" name="emergency-phone" type="tel">
    </div>
    <div class="row">
      <label for="address">经常使用的收件地址</label>
      <input id="address" name="address" type="text">
    </div>
    <button type="button">保存</button>
  </main>
</body>
</html>
